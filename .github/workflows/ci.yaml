name: CI
on:
  push:
    branches:
      - main
      - next
env:
  NODE_VERSION: 24
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm build:cjs
      - run: pnpm build:site
      - run: pnpm test
      - id: changesets
        uses: changesets/action@v2
        with:
          pr-title: Update versions
          commit-message: "chore: update versions"
          publish-script: pnpm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: actions/github-script@v7
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        with:
          script: |
            const metadata = require('./.github/workflows/metadata.js')
            await metadata({ github, context, core })
      - name: Deploy dreamkit.dev site
        if: steps.metadata.outputs['@dreamkit/site:published'] == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: packages/site/dist
      - name: Deploy next.dreamkit.dev site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages-next
          folder: packages/site/dist
